<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Remask</title>
  <desc id="desc">Abstract lines of data with private fragments replaced by shorter muted lines.</desc>

  <rect width="512" height="512" rx="112" fill="#1F4268"/>

  <!-- Preserved fragments. Their uneven lengths evoke structured data. -->
  <g fill="#F7FAFC">
    <rect x="82" y="142" width="142" height="28" rx="14"/>
    <rect x="326" y="142" width="104" height="28" rx="14"/>

    <rect x="82" y="208" width="82" height="28" rx="14"/>
    <rect x="322" y="208" width="108" height="28" rx="14"/>

    <rect x="82" y="274" width="164" height="28" rx="14"/>
    <rect x="350" y="274" width="80" height="28" rx="14"/>

    <rect x="82" y="340" width="112" height="28" rx="14"/>
    <rect x="298" y="340" width="132" height="28" rx="14"/>
  </g>

  <!-- Muted replacement lines mark the fragments removed by masking. -->
  <g fill="#9CB8CE">
    <rect x="246" y="142" width="58" height="28" rx="14"/>
    <rect x="186" y="208" width="114" height="28" rx="14"/>
    <rect x="268" y="274" width="60" height="28" rx="14"/>
    <rect x="216" y="340" width="60" height="28" rx="14"/>
  </g>
</svg>
