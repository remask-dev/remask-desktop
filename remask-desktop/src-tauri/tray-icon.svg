<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Remask menu bar icon</title>
  <desc id="desc">The Remask mark sized for a macOS menu bar template image.</desc>

  <!--
    64×64 tray canvas. The mark below is the transparent, monochrome version
    of the geometry in app-icon.svg (scaled from its 31×31 source), so the
    menu-bar and Dock marks keep the same segment lengths and spacing.
  -->
  <!-- Keep a small breathing room around the mark in the menu bar. -->
  <g fill="#000" transform="translate(1.392 1.392) scale(0.9565)">
    <rect x="3.59" y="9" width="18.94" height="8.12" rx="4.06" fill-opacity="0.30" />
    <rect x="25.24" y="9" width="35.18" height="8.12" rx="4.06" />

    <rect x="3.59" y="27.94" width="35.18" height="8.12" rx="4.06" />
    <rect x="41.47" y="27.94" width="18.94" height="8.12" rx="4.06" fill-opacity="0.30" />

    <rect x="3.59" y="46.88" width="18.94" height="8.12" rx="4.06" fill-opacity="0.30" />
    <rect x="25.24" y="46.88" width="35.18" height="8.12" rx="4.06" />
  </g>
</svg>
