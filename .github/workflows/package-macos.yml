name: Package macOS

on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Sign and notarize the macOS package"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      release:
        description: "Require a signed and notarized release package"
        required: false
        type: boolean
        default: false

jobs:
  package-macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: .cache
          key: macos-package-inputs-${{ hashFiles('scripts/packaging.lock.json') }}
      - run: npm ci
      - name: Require pinned Core release
        run: node -e 'const lock=require("./scripts/packaging.lock.json"); if (!lock.core?.version || lock.core.version === "latest" || !/^[0-9]+\.[0-9]+\.[0-9]+/.test(lock.core.version) || !/^[a-f0-9]{64}$/i.test(lock.core.manifestSha256 || "")) throw new Error("pin Core version and manifestSha256 before release")'
      - name: Select signing mode
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          requested=0
          if [[ "${{ inputs.release }}" == "true" || "${{ inputs.signed }}" == "true" ]]; then requested=1; fi
          if [[ "$requested" == 1 && -n "$APPLE_CERTIFICATE" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_KEYCHAIN_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" && -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "REMASK_SIGN_ENABLED=1" >> "$GITHUB_ENV"
            echo "Apple signing requested and credentials are present"
          else
            echo "REMASK_SIGN_ENABLED=0" >> "$GITHUB_ENV"
            if [[ "${{ inputs.release }}" == "true" ]]; then
              echo "Apple signing credentials are required for a Desktop Release" >&2
              exit 1
            fi
            echo "Apple signing unavailable; building unsigned package"
          fi
      - name: Import Apple signing certificate
        if: ${{ env.REMASK_SIGN_ENABLED == '1' }}
        id: import_apple_signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          certificate_path="$RUNNER_TEMP/remask-signing.p12"; keychain_path="$RUNNER_TEMP/remask-signing.keychain-db"
          if ! {
            test -n "$APPLE_CERTIFICATE"; test -n "$APPLE_CERTIFICATE_PASSWORD"; test -n "$APPLE_KEYCHAIN_PASSWORD"
            printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
            security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"; security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
            security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
            rm -f "$certificate_path"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
            security list-keychain -d user -s "$keychain_path" login.keychain-db; security default-keychain -s "$keychain_path"
          }; then
            echo "Apple signing certificate import failed; continuing with unsigned package"
            echo "REMASK_SIGN_ENABLED=0" >> "$GITHUB_ENV"
          fi
      - name: Require imported Apple signing certificate
        if: ${{ inputs.release }}
        run: test "$REMASK_SIGN_ENABLED" = "1"

      - name: Build package
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export REMASK_RELEASE=0 REMASK_SIGN=0
          if [[ "$REMASK_SIGN_ENABLED" == "1" ]]; then
            export REMASK_RELEASE=1 REMASK_SIGN=1
            if [[ "${{ inputs.release }}" == "true" ]]; then
              npm run package:macos
            elif ! npm run package:macos; then
              echo "Signed macOS package failed; retrying unsigned"
              rm -rf artifacts/macos
              REMASK_RELEASE=0 REMASK_SIGN=0 npm run package:macos
            fi
          else
            npm run package:macos
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: remask-macos-${{ github.sha }}
          path: artifacts/macos/
          if-no-files-found: error
