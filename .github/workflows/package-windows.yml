name: Package Windows

on:
  workflow_dispatch:
  workflow_call:

jobs:
  package-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remask-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Import Windows signing certificate
        shell: powershell
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { throw "WINDOWS_CERTIFICATE secret is required" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "WINDOWS_CERTIFICATE_PASSWORD secret is required" }
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT -notmatch '^[A-Fa-f0-9]{40}$') { throw "WINDOWS_CERTIFICATE_THUMBPRINT must be a 40-character SHA-1 thumbprint" }
          $certificatePath = Join-Path $env:RUNNER_TEMP "remask-signing.pfx"
          $certificateBytes = [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE -replace '\s', ''))
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item -LiteralPath $certificatePath -Force
          if ($certificate.Thumbprint -ne $env:WINDOWS_CERTIFICATE_THUMBPRINT.ToUpperInvariant()) {
            throw "imported certificate thumbprint does not match WINDOWS_CERTIFICATE_THUMBPRINT"
          }

      - uses: actions/cache@v4
        with:
          path: |
            remask-desktop/.cache
          key: windows-package-inputs-${{ hashFiles('remask-desktop/scripts/packaging.lock.json') }}

      - name: Install desktop dependencies
        working-directory: remask-desktop
        run: npm ci

      - name: Require pinned Core release
        working-directory: remask-desktop
        run: node -e 'const lock=require("./scripts/packaging.lock.json"); if (!lock.core?.version || lock.core.version === "latest" || !/^[0-9]+\\.[0-9]+\\.[0-9]+/.test(lock.core.version) || !/^[a-f0-9]{64}$/i.test(lock.core.manifestSha256 || "")) { throw new Error("formal builds require a concrete Core version and manifestSha256 in packaging.lock.json") }'

      - name: Build native Windows installer
        shell: bash
        working-directory: remask-desktop
        env:
          REMASK_GO_CC: C:/msys64/mingw64/bin/gcc.exe
          REMASK_RELEASE: "1"
          REMASK_SIGN: "1"
          REMASK_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: npm run package:windows

      - name: Install and run Windows smoke test
        shell: powershell
        run: |
          $installer = Get-ChildItem ./artifacts/windows/x64/*/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer artifact was not found" }
          ./remask-desktop/scripts/smoke-windows.ps1 `
            -InstallerPath $installer.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: remask-windows-x64-${{ github.sha }}
          path: artifacts/windows/x64/
          if-no-files-found: error
