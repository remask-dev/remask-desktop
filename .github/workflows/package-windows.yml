name: Package Windows

on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Sign the Windows package"
        required: false
        type: boolean
        default: true
  push:
    tags: ["v*"]

jobs:
  package-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: .cache
          key: windows-package-inputs-${{ hashFiles('scripts/packaging.lock.json') }}
      - run: npm ci
      - name: Require pinned Core release
        run: node -e 'const lock=require("./scripts/packaging.lock.json"); if (!lock.core?.version || lock.core.version === "latest" || !/^[0-9]+\.[0-9]+\.[0-9]+/.test(lock.core.version) || !/^[a-f0-9]{64}$/i.test(lock.core.manifestSha256 || "")) throw new Error("pin Core version and manifestSha256 before release")'
      - name: Select signing mode
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          requested=0
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.signed }}" == "true" ]]; then requested=1; fi
          if [[ "$requested" == 1 && -n "$WINDOWS_CERTIFICATE" && -n "$WINDOWS_CERTIFICATE_PASSWORD" && "$WINDOWS_CERTIFICATE_THUMBPRINT" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            echo "REMASK_SIGN_ENABLED=1" >> "$GITHUB_ENV"
            echo "Windows signing requested and credentials are present"
          else
            echo "REMASK_SIGN_ENABLED=0" >> "$GITHUB_ENV"
            echo "Windows signing unavailable; building unsigned package"
          fi
      - name: Import Windows signing certificate
        if: ${{ env.REMASK_SIGN_ENABLED == '1' }}
        shell: powershell
        id: import_windows_signing
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $ErrorActionPreference = "Stop"
          try {
            if (-not $env:WINDOWS_CERTIFICATE) { throw "WINDOWS_CERTIFICATE secret is required" }
            $path = Join-Path $env:RUNNER_TEMP "remask-signing.pfx"
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String(($env:WINDOWS_CERTIFICATE -replace '\s', '')))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
            Remove-Item -LiteralPath $path -Force
          } catch {
            Write-Warning "Windows signing certificate import failed; continuing with unsigned package: $($_.Exception.Message)"
            "REMASK_SIGN_ENABLED=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build package
        shell: bash
        env:
          REMASK_GO_CC: C:/msys64/mingw64/bin/gcc.exe
          REMASK_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          export REMASK_RELEASE=0 REMASK_SIGN=0
          if [[ "$REMASK_SIGN_ENABLED" == "1" ]]; then
            export REMASK_RELEASE=1 REMASK_SIGN=1
            if ! npm run package:windows; then
              echo "Signed Windows package failed; retrying unsigned"
              rm -rf artifacts/windows
              REMASK_RELEASE=0 REMASK_SIGN=0 npm run package:windows
            fi
          else
            npm run package:windows
          fi
      - name: Install and smoke test
        shell: powershell
        run: |
          $installer = Get-ChildItem ./artifacts/windows/x64/*/*-setup.exe | Select-Object -First 1
          ./scripts/smoke-windows.ps1 -InstallerPath $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: remask-windows-x64-${{ github.sha }}
          path: artifacts/windows/x64/
