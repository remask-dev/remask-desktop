[package]
name = "remask-desktop"
version = "0.1.2"
description = "Remask desktop privacy gateway"
authors = ["Remask"]
edition = "2021"

[lib]
name = "remask_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# Patch tray-icon so the macOS menu-bar icon renders at the full 22pt bar
# height instead of the crate's hardcoded 18pt (vendor/tray-icon).
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
